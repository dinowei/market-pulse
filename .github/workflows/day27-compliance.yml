name: Day 27 Income Events Accessibility Performance

on:
  pull_request:
    paths:
      - "apps/api/app/contracts.py"
      - "apps/api/app/portfolios/**"
      - "apps/api/app/telemetry.py"
      - "apps/api/app/routers.py"
      - "apps/api/migrations/**"
      - "apps/api/tests/test_day27_*.py"
      - "apps/web/**"
      - "docs/api/openapi.json"
      - "scripts/day27_performance_gate.mjs"
      - ".github/workflows/day27-compliance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
      - name: Install API dependencies
        run: uv sync --project apps/api --group dev
      - name: API contracts, privacy and referential integrity
        run: |
          uv run --directory apps/api pytest -q tests/test_day27_income_markers_telemetry.py
          uv run --directory apps/api ruff check app tests
          uv run --project apps/api python scripts/day26_compliance.py
          python scripts/week1_gate.py secrets
          python scripts/week1_gate.py supply-chain
          git diff --check

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: 24
          cache: pnpm
      - name: Install web dependencies
        run: pnpm install --frozen-lockfile
      - name: Frontend quality and performance gates
        run: |
          pnpm --dir apps/web lint
          pnpm --dir apps/web typecheck
          pnpm --dir apps/web test
          pnpm --dir apps/web build
          node scripts/day27_performance_gate.mjs
      - name: Install Chromium for accessibility gate
        run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - name: Start local frontend
        run: |
          nohup pnpm --dir apps/web dev --hostname 127.0.0.1 > /tmp/market-pulse-web.log 2>&1 &
          for i in $(seq 1 30); do curl --silent --fail http://127.0.0.1:3000/ && break || sleep 2; done
      - name: Axe accessibility smoke gate
        run: pnpm --dir apps/web exec playwright test e2e/day27-a11y.spec.ts
