[project]
name = "market-pulse-api"
version = "0.1.0"
description = "Market Pulse API foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "asyncpg==0.30.0",
  "alembic==1.16.5",
  "pydantic-settings==2.10.1",
  "psycopg[binary]==3.2.10",
  "redis==6.4.0",
  "sqlalchemy==2.0.43",
  "uvicorn[standard]==0.35.0",
  "argon2-cffi==25.1.0",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
