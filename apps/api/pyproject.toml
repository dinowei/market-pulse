[project]
name = "market-pulse-api"
version = "0.1.0"
description = "Market Pulse API foundation"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
  "httpx2==2.12.0",
  "pytest==8.4.2",
  "ruff==0.13.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
